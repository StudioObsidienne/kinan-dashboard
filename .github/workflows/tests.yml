name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verifier
      - name: Tests (Linux : écran virtuel pour Electron)
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm test
      - name: Tests
        if: runner.os != 'Linux'
        run: npm test
